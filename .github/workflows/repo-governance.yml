name: Repository Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AIOS_AUDIT_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.AIOS_AUDIT_CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify audit checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AIOS_AUDIT_CANDIDATE_SHA" || {
            echo "Audit checkout mismatch: expected $AIOS_AUDIT_CANDIDATE_SHA, got $actual"
            exit 1
          }
      - name: Verify required repository surfaces
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            CONTRIBUTING.md
            SECURITY.md
            SPEC.md
            docs/ARCHITECTURE.md
            docs/AUTHORITY_BOUNDARIES.md
            docs/DEVELOPMENT.md
            docs/VALIDATION.md
            .github/pull_request_template.md
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "Missing or empty required file: $path"; exit 1; }
          done
      - name: Verify authority boundary markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Notion" docs/AUTHORITY_BOUNDARIES.md
          grep -q "Google Drive" docs/AUTHORITY_BOUNDARIES.md
          grep -q "live source code" docs/AUTHORITY_BOUNDARIES.md
          grep -q "authority_transfer" README.md
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts/agent_system_audit.py
      - name: Test organization auditor
        run: python -m unittest discover -s tests -p 'test_agent_system_audit.py'
      - name: Audit repository organization
        run: python scripts/agent_system_audit.py --output outputs/agent-system-audit.json
      - name: Upload organization audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aios-tools-organization-audit-${{ github.run_id }}
          path: outputs/agent-system-audit.json
          if-no-files-found: error
