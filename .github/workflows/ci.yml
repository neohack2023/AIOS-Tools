name: AIOS-Tools CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test shared core
        run: pytest
      - name: Smoke test CLI
        run: |
          aios-tools list
          aios-tools invoke system.health --input '{}'
      - name: Smoke test MCP adapter
        run: aios-tools-mcp --help

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "Checkout mismatch: expected $expected, got $actual" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test shared core
        run: pytest
      - name: Smoke test CLI
        run: |
          aios-tools list
          aios-tools invoke system.health --input '{}'
      - name: Smoke test MCP adapter
        run: aios-tools-mcp --help

  browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m pip install "pytest-timeout>=2.3,<3"
      - name: Install governed Chromium fixture runtime
        run: python -m playwright install --with-deps chromium
      - name: Browser core unit and local-server fixtures
        run: pytest -vv --timeout=20 tests/test_browser_*.py
      - name: Registry and health CLI plus MCP startup smoke
        run: |
          aios-tools list
          aios-tools invoke system.health --input '{}'
          aios-tools-mcp --help

  cartography-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cartography-web
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction and screenshot regressions
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartography-web-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/cartography-web/build.log
            apps/cartography-web/playwright-report
            apps/cartography-web/test-results
          if-no-files-found: ignore
