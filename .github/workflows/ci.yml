name: AIOS-Tools CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test shared core
        run: pytest
      - name: Smoke test CLI
        run: |
          aios-tools list
          aios-tools invoke system.health --input '{}'
      - name: Smoke test MCP adapter
        run: aios-tools-mcp --help

  cartography-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cartography-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction and screenshot regressions
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartography-web-browser-evidence
          path: |
            apps/cartography-web/build.log
            apps/cartography-web/playwright-report
            apps/cartography-web/test-results
          if-no-files-found: ignore
