name: Audio Model Dependency Lock

on:
  pull_request:
    paths:
      - ".github/workflows/audio-model-dependency-lock.yml"
      - "docs/evidence/AUDIO_STEM_SECTION_MODEL_LOCK_SLICE2A.json"
      - "scripts/verify_audio_model_lock.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch and seal package plus UMXHQ weights
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quarantine audio-model-lock-artifacts
          mkdir -p .quarantine/package .quarantine/weights .quarantine/metadata audio-model-lock-artifacts
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          ALLOWED = {"pypi.org", "files.pythonhosted.org", "zenodo.org", "www.zenodo.org"}
          TARGETS = ["vocals", "drums", "bass", "other"]
          MANIFEST = pathlib.Path("docs/evidence/AUDIO_STEM_SECTION_MODEL_LOCK_SLICE2A.json")
          ROOT = pathlib.Path(".quarantine")
          RECEIPT = pathlib.Path("audio-model-lock-artifacts/dependency-fetch-receipt.json")
          USER_AGENT = "AIOS-Tools-Slice2A-DependencyLock/0.1"

          class FailClosed(RuntimeError):
              pass

          def allowed(url):
              parsed = urllib.parse.urlparse(url)
              host = (parsed.hostname or "").lower()
              if parsed.scheme != "https" or host not in ALLOWED:
                  raise FailClosed(f"URL not allowlisted: {url}")

          class Redirects(urllib.request.HTTPRedirectHandler):
              def __init__(self, chain):
                  super().__init__()
                  self.chain = chain
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  allowed(newurl)
                  self.chain.append(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          def open_url(url):
              allowed(url)
              chain = [url]
              opener = urllib.request.build_opener(Redirects(chain))
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              response = opener.open(request, timeout=120)
              final_url = response.geturl()
              allowed(final_url)
              return response, chain, final_url

          def fetch_json(url, path):
              response, chain, final_url = open_url(url)
              with response:
                  payload = response.read()
              data = json.loads(payload.decode("utf-8"))
              path.write_bytes(payload)
              return data, {
                  "original_url": url,
                  "final_url": final_url,
                  "redirect_chain": chain,
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "byte_size": len(payload),
              }

          def fetch_file(url, path, expected_md5=None, expected_sha256=None, expected_size=None):
              response, chain, final_url = open_url(url)
              md5 = hashlib.md5(usedforsecurity=False)
              sha256 = hashlib.sha256()
              size = 0
              part = path.with_suffix(path.suffix + ".part")
              with response, part.open("wb") as handle:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      handle.write(chunk)
                      md5.update(chunk)
                      sha256.update(chunk)
                      size += len(chunk)
              actual_md5 = md5.hexdigest()
              actual_sha256 = sha256.hexdigest()
              if expected_md5 and actual_md5 != expected_md5:
                  part.unlink(missing_ok=True)
                  raise FailClosed(f"MD5 mismatch for {path.name}: {actual_md5}")
              if expected_sha256 and actual_sha256 != expected_sha256:
                  part.unlink(missing_ok=True)
                  raise FailClosed(f"SHA-256 mismatch for {path.name}: {actual_sha256}")
              if expected_size is not None and size != expected_size:
                  part.unlink(missing_ok=True)
                  raise FailClosed(f"size mismatch for {path.name}: {size}")
              part.replace(path)
              return {
                  "original_url": url,
                  "final_url": final_url,
                  "redirect_chain": chain,
                  "md5": actual_md5,
                  "sha256": actual_sha256,
                  "byte_size": size,
              }

          manifest = json.loads(MANIFEST.read_text(encoding="utf-8"))
          if manifest.get("profile_id") != "slice2-stem-section-v0.1":
              raise FailClosed("unexpected profile_id")
          if manifest.get("authority", {}).get("authority_transfer") is not False:
              raise FailClosed("authority_transfer must remain false")
          if manifest.get("runtime_reference", {}).get("network_during_analysis") is not False:
              raise FailClosed("analysis network policy must remain false")
          if [item.get("target") for item in manifest.get("weights", [])] != TARGETS:
              raise FailClosed("weight target order mismatch")

          pypi_url = "https://pypi.org/pypi/openunmix/1.3.0/json"
          pypi, pypi_transport = fetch_json(pypi_url, ROOT / "metadata/openunmix-1.3.0-pypi.json")
          wheel = next(item for item in pypi["urls"] if item["filename"] == "openunmix-1.3.0-py3-none-any.whl")
          wheel_result = fetch_file(
              wheel["url"],
              ROOT / "package" / wheel["filename"],
              expected_md5=wheel["digests"]["md5"],
              expected_sha256=wheel["digests"]["sha256"],
              expected_size=wheel["size"],
          )

          zenodo_url = "https://zenodo.org/api/records/3370489"
          zenodo, zenodo_transport = fetch_json(zenodo_url, ROOT / "metadata/zenodo-3370489.json")
          provider_files = {item["key"]: item for item in zenodo["files"]}
          license_value = zenodo.get("metadata", {}).get("license")
          if isinstance(license_value, dict):
              license_value = license_value.get("id") or license_value.get("title")
          if not license_value:
              raise FailClosed("Zenodo license metadata missing")

          weights = []
          for item in manifest["weights"]:
              provider = provider_files.get(item["filename"])
              if provider is None:
                  raise FailClosed(f"missing provider file: {item['filename']}")
              provider_md5 = provider["checksum"].split(":", 1)[1].lower()
              if provider_md5 != item["provider_md5"]:
                  raise FailClosed(f"provider checksum drift: {item['filename']}")
              result = fetch_file(
                  item["source_url"],
                  ROOT / "weights" / item["filename"],
                  expected_md5=provider_md5,
                  expected_size=provider["size"],
              )
              weights.append({
                  "target": item["target"],
                  "filename": item["filename"],
                  "source_url": item["source_url"],
                  "final_url": result["final_url"],
                  "redirect_chain": result["redirect_chain"],
                  "provider_md5": provider_md5,
                  "local_md5": result["md5"],
                  "sha256": result["sha256"],
                  "byte_size": result["byte_size"],
                  "admitted_to_quarantine": True,
              })

          receipt = {
              "schema_version": "0.1.0",
              "status": "DEPENDENCIES_QUARANTINED_VERIFIED",
              "profile_id": "slice2-stem-section-v0.1",
              "tool_identity": "audio.stem_section_analyze",
              "retrieved_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "authority_transfer": False,
              "network_policy": {
                  "phase": "CONTROLLED_DEPENDENCY_FETCH",
                  "allowed_hosts": sorted(ALLOWED),
                  "analysis_network_allowed": False,
              },
              "provider_metadata": {
                  "pypi": pypi_transport,
                  "zenodo": {
                      **zenodo_transport,
                      "record_id": 3370489,
                      "doi": "10.5281/zenodo.3370489",
                      "license": license_value,
                  },
              },
              "package_artifact": {
                  "filename": wheel["filename"],
                  "source_url": wheel["url"],
                  "final_url": wheel_result["final_url"],
                  "redirect_chain": wheel_result["redirect_chain"],
                  "provider_sha256": wheel["digests"]["sha256"],
                  "local_sha256": wheel_result["sha256"],
                  "provider_md5": wheel["digests"]["md5"],
                  "local_md5": wheel_result["md5"],
                  "byte_size": wheel_result["byte_size"],
                  "admitted_to_quarantine": True,
              },
              "weights": weights,
              "gates": {
                  "package_artifact_locked": True,
                  "all_weight_provider_checksums_verified": True,
                  "all_weight_sha256_present": True,
                  "resource_envelope_measured_with_pretrained_weights": False,
                  "profile_checksum_frozen": False,
                  "runtime_review_completed": False,
                  "runtime_admission": False,
                  "pilot_authorized": False,
              },
          }
          RECEIPT.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("DEPENDENCY_FETCH_RECEIPT_JSON=" + json.dumps(receipt, sort_keys=True, separators=(",", ":")))
          PY

      - name: Verify quarantined weights offline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_audio_model_lock.py \
            --manifest docs/evidence/AUDIO_STEM_SECTION_MODEL_LOCK_SLICE2A.json \
            --weights-dir .quarantine/weights \
            | tee audio-model-lock-artifacts/quarantine-verification.json

      - name: Seal transfer inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path(".quarantine")
          items = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              items.append({
                  "path": str(path.relative_to(root)),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "byte_size": path.stat().st_size,
              })
          inventory = {
              "schema_version": "0.1.0",
              "status": "QUARANTINE_TRANSFER_BUNDLE_SEALED",
              "authority_transfer": False,
              "items": items,
          }
          Path("audio-model-lock-artifacts/quarantine-inventory.json").write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("QUARANTINE_INVENTORY_JSON=" + json.dumps(inventory, sort_keys=True, separators=(",", ":")))
          PY
          python -m compileall -q scripts tests

      - name: Upload governed quarantine bundle
        uses: actions/upload-artifact@v4
        with:
          name: audio-model-dependency-lock-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            audio-model-lock-artifacts/
            .quarantine/package/openunmix-1.3.0-py3-none-any.whl
            .quarantine/weights/*.pth
            .quarantine/metadata/*.json
